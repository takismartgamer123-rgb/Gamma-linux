# Gamma Lite build target.
EDITION="lite"
BASE_DISTRO="debian"
BASE_SUITE="trixie"
BASE_ARCH="amd64"
BASE_MIRROR="https://deb.debian.org/debian"
SECURITY_MIRROR="https://security.debian.org/debian-security"
APT_COMPONENTS="main contrib non-free-firmware"
KERNEL_PACKAGE="linux-image-amd64"
EXTRA_PACKAGES=""

LIVE_DIR="live"
LIVE_BOOT_PARAM="boot=live"

HOSTNAME="gamma-lite"
SWAPPINESS="100"
VFS_CACHE="100"
DIRTY_RATIO="10"
ZRAM_PERCENT="150"
