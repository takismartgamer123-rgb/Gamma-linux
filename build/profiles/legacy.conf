# Gamma Legacy 32-bit build target.
# Debian 12 Bookworm remains the selected i386 base during its LTS period.
EDITION="legacy"
BASE_DISTRO="debian"
BASE_SUITE="bookworm"
BASE_ARCH="i386"
BASE_MIRROR="https://deb.debian.org/debian"
SECURITY_MIRROR="https://security.debian.org/debian-security"
APT_COMPONENTS="main contrib non-free-firmware"
KERNEL_PACKAGE="linux-image-686-pae"
EXTRA_PACKAGES=""

LIVE_DIR="live"
LIVE_BOOT_PARAM="boot=live"

HOSTNAME="gamma-legacy"
SWAPPINESS="100"
VFS_CACHE="100"
DIRTY_RATIO="5"
ZRAM_PERCENT="100"
