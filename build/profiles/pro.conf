# Gamma Pro build target.
EDITION="pro"
BASE_DISTRO="debian"
BASE_SUITE="trixie"
BASE_ARCH="amd64"
BASE_MIRROR="https://deb.debian.org/debian"
SECURITY_MIRROR="https://security.debian.org/debian-security"
APT_COMPONENTS="main contrib non-free-firmware"
