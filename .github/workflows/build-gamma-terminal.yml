name: Gamma Terminal DEB Builder

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-gamma-terminal.yml"
      - "packages/gamma-terminal/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.deb_arch }} on Debian 12
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            platform: linux/amd64
          - deb_arch: i386
            platform: linux/386

    steps:
      - name: Enable foreign architecture emulation
        uses: docker/setup-qemu-action@v3

      - name: Build Debian package
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/$DEB_ARCH"

          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            -e DEB_ARCH="$DEB_ARCH" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /tmp \
            --entrypoint bash \
            debian:bookworm -s <<'BUILD_SCRIPT'
          set -euxo pipefail

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            cmake \
            build-essential \
            pkg-config \
            debhelper \
            dpkg-dev \
            fakeroot \
            perl \
            gettext \
            libglib2.0-dev \
            libgtk-3-dev \
            libvte-2.91-dev \
            libx11-dev

          git clone --branch SAKURA_3_8_6 --depth 1 \
            https://github.com/dabisu/sakura.git sakura-source
          cd sakura-source

          mkdir -p debian

          cat > debian/control <<'EOF'
          Source: gamma-terminal
          Section: x11
          Priority: optional
          Maintainer: Gamma Linux Maintainers <founder@mail.gamma-linux.is-local.org>
          Build-Depends:
           debhelper-compat (= 13),
           cmake,
           pkg-config,
           perl,
           gettext,
           libglib2.0-dev,
           libgtk-3-dev,
           libvte-2.91-dev,
           libx11-dev
          Standards-Version: 4.6.2
          Rules-Requires-Root: no

          Package: gamma-terminal
          Architecture: any
          Depends: \${shlibs:Depends}, \${misc:Depends}
          Description: Gamma Terminal
           Lightweight GTK 3 and VTE terminal for Gamma Linux.
           This bootstrap package is built from the Sakura 3.8.6 source base.
          EOF

          cat > debian/rules <<'EOF'
          #!/usr/bin/make -f
          %:
          	dh $@ --buildsystem=cmake

          override_dh_auto_configure:
          	dh_auto_configure -- \
          		-DCMAKE_INSTALL_PREFIX=/usr \
          		-DCMAKE_BUILD_TYPE=Release
          EOF
          chmod 755 debian/rules

          cat > debian/gamma-terminal.install <<'EOF'
          usr/bin/sakura
          usr/share/applications/sakura.desktop
          usr/share/pixmaps/terminal-tango.svg
          usr/share/man/man1/sakura.1
          usr/share/doc/sakura/README.md
          usr/share/locale/*/LC_MESSAGES/sakura.mo
          EOF

          cat > debian/gamma-terminal.links <<'EOF'
          usr/bin/sakura usr/bin/gamma-terminal
          EOF

          cat > debian/changelog <<'EOF'
          gamma-terminal (3.8.6-1gamma1) unstable; urgency=medium

            * Initial Debian 12 bootstrap package using the Sakura 3.8.6 source base.

           -- Gamma Linux Maintainers <founder@mail.gamma-linux.is-local.org>  Sat, 31 Oct 2026 00:00:00 +0000
          EOF

          cat > debian/copyright <<'EOF'
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: Sakura
          Source: https://github.com/dabisu/sakura
          Files: *
          Copyright: David Gómez Espinosa
          License: GPL-2+
           This program is free software; you can redistribute it and/or
           modify it under the terms of the GNU General Public License
           as published by the Free Software Foundation; either version 2
           of the License, or (at your option) any later version.
          EOF

          dpkg-buildpackage -us -uc -b

          mkdir -p "/work/dist/$DEB_ARCH"
          cp ../gamma-terminal_*.deb "/work/dist/$DEB_ARCH/"
          dpkg-deb --info /work/dist/$DEB_ARCH/*.deb
          BUILD_SCRIPT

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamma-Terminal-DEB-${{ matrix.deb_arch }}
          path: dist/${{ matrix.deb_arch }}/*.deb
          if-no-files-found: error
          retention-days: 30
