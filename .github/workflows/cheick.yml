name: Check Built Debian Live ISO

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID that produced the gamma-lite artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Download gamma-lite artifact
        uses: actions/download-artifact@v4
        with:
          name: gamma-lite
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools

      - name: Inspect Debian Live ISO
        run: |
          set -euo pipefail
          test -s output/gamma-lite.iso
          xorriso -indev output/gamma-lite.iso -ls /
          xorriso -indev output/gamma-lite.iso -ls /live

      - name: Extract ISO
        run: |
          set -euo pipefail
          mkdir iso-root
          xorriso -osirrox on -indev output/gamma-lite.iso -extract / iso-root
          test -s iso-root/live/vmlinuz
          test -s iso-root/live/initrd.lz
          test -s iso-root/live/filesystem.squashfs
          test -s iso-root/EFI/BOOT/BOOTX64.EFI
          echo "Debian Live ISO tree: PASS"

      - name: Inspect SquashFS
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/gamma
          cleanup() {
            sudo umount /mnt/gamma 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo mount -o loop,ro iso-root/live/filesystem.squashfs /mnt/gamma

          echo "===== INIT ====="
          test -x /mnt/gamma/sbin/init
          ls -l /mnt/gamma/sbin/init

          echo "===== OS ====="
          cat /mnt/gamma/etc/os-release
          grep -q '^ID=debian$' /mnt/gamma/etc/os-release
          grep -q '^VERSION_CODENAME=trixie          test -f /mnt/gamma/usr/share/initramfs-tools/scripts/live
          if sudo chroot /mnt/gamma dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | grep -qx 'casper'; then
            echo "Unexpected Ubuntu Casper package found."
            exit 1
          fi

          echo "Debian Trixie root filesystem: PASS"
 /mnt/gamma/etc/os-release

          echo "===== GAMMA LIVE SESSION ====="
          grep -q '^LIVE_HOSTNAME=gamma-lite          test -f /mnt/gamma/usr/share/initramfs-tools/scripts/live
          if sudo chroot /mnt/gamma dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | grep -qx 'casper'; then
            echo "Unexpected Ubuntu Casper package found."
            exit 1
          fi

          echo "Debian Trixie root filesystem: PASS"
 /mnt/gamma/etc/live/config.conf
          grep -q '^LIVE_USERNAME=gamma          test -f /mnt/gamma/usr/share/initramfs-tools/scripts/live
          if sudo chroot /mnt/gamma dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | grep -qx 'casper'; then
            echo "Unexpected Ubuntu Casper package found."
            exit 1
          fi

          echo "Debian Trixie root filesystem: PASS"
 /mnt/gamma/etc/live/config.conf
          grep -q '^LIVE_USER_FULLNAME="Gamma Linux User"          test -f /mnt/gamma/usr/share/initramfs-tools/scripts/live
          if sudo chroot /mnt/gamma dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | grep -qx 'casper'; then
            echo "Unexpected Ubuntu Casper package found."
            exit 1
          fi

          echo "Debian Trixie root filesystem: PASS"
 /mnt/gamma/etc/live/config.conf

          echo "===== LIVE BOOT ====="
          test -f /mnt/gamma/usr/share/initramfs-tools/scripts/live
          if sudo chroot /mnt/gamma dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | grep -qx 'casper'; then
            echo "Unexpected Ubuntu Casper package found."
            exit 1
          fi

          echo "Debian Trixie root filesystem: PASS"
