<image x="76" y="58" width="590" height="167" xlink:href="https://gamma-linux.is-local.org/assets/brand/gamma-wordmark.png" preserveAspectRatio="xMinYMin meet"/>
<rect x="82" y="246" width="510" height="3" rx="2" fill="url(#line)"/>
<text x="82" y="352" fill="#f5f3ff" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Revive old computers.</text>
<text x="82" y="416" fill="#d8d2eb" font-family="Arial,Helvetica,sans-serif" font-size="31">Fast. Lightweight. Beautiful. Always free.</text>
<text x="82" y="560" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="1.2">MADE IN ALGERIA  •  OPEN SOURCE  •  BUILT FOR OLDER HARDWARE</text>
