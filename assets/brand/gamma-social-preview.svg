<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Gamma Linux — No PC deserves to die</title>
<desc id="desc">Revive old computers. Fast. Lightweight. Beautiful. Always free. Made in Algeria.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090718"/><stop offset=".52" stop-color="#211044"/><stop offset="1" stop-color="#080711"/></linearGradient>
  <radialGradient id="aurora"><stop stop-color="#a855f7" stop-opacity=".85"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<ellipse cx="900" cy="95" rx="420" ry="230" fill="url(#aurora)" filter="url(#blur)"/>
<path d="M0 370 C230 310 340 425 540 350 S940 265 1200 340 V630 H0Z" fill="#160d32" opacity=".74"/>
<path d="M0 420 C270 330 360 470 610 380 S980 330 1200 390" fill="none" stroke="#a78bfa" stroke-opacity=".24" stroke-width="3"/>
<path d="M0 450 C270 360 430 510 690 415 S1030 380 1200 430" fill="none" stroke="#60a5fa" stroke-opacity=".12" stroke-width="2"/>
